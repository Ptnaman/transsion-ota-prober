name: Tecno Naman OTA 3 Month Backfill

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tecno-naman-ota-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check whether backfill already completed
        id: guard
        run: |
          if [ -f backfill-2026-05-15.done ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "3-month backfill has already completed. Nothing to do."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OTA Tracker
        if: steps.guard.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Discover OTA builds from the last 3 months
        if: steps.guard.outputs.run == 'true'
        run: |
          python scripts/prepare_recent_backfill.py --since-date 2026-05-15 --jobs 4 --timeout 1200

      - name: Backup configs before historical notification run
        if: steps.guard.outputs.run == 'true'
        run: |
          cp -a configs .configs-backfill-backup

      - name: Send 3-month OTA backfill to Telegram
        if: steps.guard.outputs.run == 'true'
        env:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_id: ${{ secrets.CHAT_ID }}
          telegraph_token: ${{ secrets.TELEGRAPH_TOKEN }}
        run: |
          checkota -d configs/ --jobs 4 --timeout 1800

      - name: Restore configs after historical run
        if: always() && steps.guard.outputs.run == 'true'
        run: |
          if [ -d .configs-backfill-backup ]; then
            rm -rf configs
            mv .configs-backfill-backup configs
          fi

      - name: Verify all selected historical notifications were saved
        if: steps.guard.outputs.run == 'true' && success()
        run: |
          python scripts/verify_recent_backfill.py

      - name: Mark backfill complete and persist state
        if: steps.guard.outputs.run == 'true' && success()
        run: |
          touch backfill-2026-05-15.done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f processed_updates.txt backfill-2026-05-15.done
          if git diff --cached --quiet; then
            echo "No backfill state changes to save."
          else
            git commit -m "Complete 3 month OTA backfill"
            git push
          fi
