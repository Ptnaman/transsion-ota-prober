name: Tecno Naman OTA Baseline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OTA Tracker
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Register all currently available OTA titles without Telegram
        run: |
          checkota -d configs/ --jobs 4 --timeout 600 --register-update --skip-telegram

      - name: Persist dedup baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add processed_updates.txt
          if git diff --cached --quiet; then
            echo "No new OTA titles to save."
          else
            git commit -m "Baseline current OTA titles"
            git push
          fi
