name: Tecno Naman OTA Check

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tecno-naman-ota-check
  cancel-in-progress: false

jobs:
  ota-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OTA Tracker
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Scan all TECNO Infinix itel configs and notify new OTA
        env:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_id: ${{ secrets.CHAT_ID }}
          telegraph_token: ${{ secrets.TELEGRAPH_TOKEN }}
        run: |
          checkota -d configs/ --jobs 4 --timeout 600

      - name: Persist OTA state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add configs/
          git add -f processed_updates.txt
          if git diff --cached --quiet; then
            echo "No OTA state changes to save."
          else
            git commit -m "Update OTA tracker state"
            git push
          fi
