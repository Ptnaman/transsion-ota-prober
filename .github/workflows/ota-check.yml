name: Tecno Naman OTA Check

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: tecno-naman-ota-check
  cancel-in-progress: false

jobs:
  ota-check:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OTA Tracker
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Scan all TECNO Infinix itel configs and notify new OTA
        id: scan
        env:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_id: ${{ secrets.CHAT_ID }}
          telegraph_token: ${{ secrets.TELEGRAPH_TOKEN }}
        run: |
          sed -i 's/timeout=15/timeout=45/' checkota/telegram.py

          status=1
          for attempt in 1 2; do
            echo "OTA scan attempt ${attempt}/2"
            set +e
            checkota -d configs/ --jobs 8 --timeout 900
            status=$?
            set -e

            if [ "$status" -eq 0 ]; then
              break
            fi

            echo "OTA scan attempt ${attempt} exited with code ${status}."
            if [ "$attempt" -lt 2 ]; then
              echo "Retrying failed/transient checks once..."
              sleep 10
            fi
          done

          echo "status=${status}" >> "$GITHUB_OUTPUT"
          # Persist successful OTA state even if one config still failed.
          exit 0

      - name: Persist OTA state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add configs/
          git add -f processed_updates.txt
          if git diff --cached --quiet; then
            echo "No OTA state changes to save."
          else
            git commit -m "Update OTA tracker state"
            git push
          fi

      - name: Report incomplete OTA scan
        if: steps.scan.outputs.status != '0'
        run: |
          echo "OTA scan still had failures after retry (exit code: ${{ steps.scan.outputs.status }})."
          echo "Successful updates were still notified and persisted; inspect this run for the failed configs."
          exit 1
