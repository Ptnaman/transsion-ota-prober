name: Tecno Naman OTA Check

on:
  workflow_dispatch:

jobs:
  ota-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OTA Tracker
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Test TECNO POVA Curve 5G
        env:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_id: ${{ secrets.CHAT_ID }}
          telegraph_token: ${{ secrets.TELEGRAPH_TOKEN }}
        run: |
          checkota -c LJ8k --dry-run
