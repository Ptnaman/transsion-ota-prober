name: Tecno Naman Telegram Test

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/telegram-test.yml"

permissions:
  contents: read

jobs:
  telegram-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OTA Tracker
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Extract KM9 170 to 180 OTA source metadata
        run: |
          python - <<'PY'
          from checkota.zip_metadata import fetch_zip_member
          url = "https://android.googleapis.com/packages/ota-api/package/8eae88d4e49233f30b0ff61cee652235b176031b.zip"
          content = fetch_zip_member(
              url,
              "META-INF/com/android/metadata",
              timeout=30,
              headers={"User-Agent": "transsion-ota-prober/1.0"},
          ).decode("utf-8", errors="replace")
          print("===== RAW OTA METADATA =====")
          print(content)
          PY
