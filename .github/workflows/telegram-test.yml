name: Tecno Naman Telegram Test

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/telegram-test.yml"

permissions:
  contents: read

jobs:
  telegram-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Send missed POVA Slim 5G Android 16 OTA
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests

          text = """<b>OTA Update Available</b>

<b>Device:</b> TECNO POVA Slim 5G (Global - OP Market)
<b>Title:</b> Tcard_KM9-16.3.0.145SP04-OP005PF001AZ_a15
<b>OS:</b> Android 16

<b>Update Version:</b>
KM9-16.3.0.145SP04(OP005PF001AZ)

<b>Size:</b> 8849.2 MB
<b>Incremental:</b> 301450032
<b>Security patch:</b> 2026-08-01
<b>Fingerprint:</b> <code>TECNO/KM9-OP/TECNO-KM9:16/BP2A.250605.031.A3/301450032:user/release-keys</code>
<b>Build date:</b> 2026-08-11 01:14:46 (CST)

<b>Google OTA link:</b>
https://android.googleapis.com/packages/ota-api/package/572127f6cb5c8ea3ed479b275e5b8cac8386a082.zip
"""
          response = requests.post(
              f"https://api.telegram.org/bot{os.environ['BOT_TOKEN']}/sendMessage",
              json={
                  "chat_id": os.environ["CHAT_ID"],
                  "text": text,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": True,
              },
              timeout=45,
          )
          response.raise_for_status()
          print("POVA Slim 5G Android 16 OTA notification sent successfully")
          PY
