name: Tecno Naman Telegram Test

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/telegram-test.yml"

permissions:
  contents: read

jobs:
  telegram-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OTA Tracker
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Probe KM9 using original google-ota-prober request fields
        env:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_id: ${{ secrets.CHAT_ID }}
          telegraph_token: ${{ secrets.TELEGRAPH_TOKEN }}
        run: |
          set -o pipefail
          sed -i 's/timeout=15/timeout=45/' checkota/telegram.py
          python - <<'PY'
          from pathlib import Path
          p = Path("checkota/update_checker.py")
          s = p.read_text()
          s = s.replace(
              '        checkin.build.CopyFrom(build)\n        checkin.roaming = "WIFI::"',
              '        checkin.build.CopyFrom(build)\n        checkin.lastCheckinMsec = 0\n        checkin.roaming = "WIFI::"'
          )
          s = s.replace(
              '        checkin.voiceCapable = False\n',
              '        checkin.voiceCapable = False\n        checkin.unknown19 = "WIFI"\n'
          )
          s = s.replace(
              '        payload.fetchSystemUpdates = 1\n',
              '        payload.fetchSystemUpdates = 1\n        payload.unknown30 = 0\n'
          )
          p.write_text(s)
          PY
          FOUND=0
          for i in $(seq 1 5); do
            echo "===== Original-request identity attempt $i/5 ====="
            OUTPUT=$(checkota -c configs/config-KM9.yml --region OP --force-notify --timeout 60 2>&1 || true)
            echo "$OUTPUT"
            if echo "$OUTPUT" | grep -q "New OTA update found"; then
              FOUND=1
              echo "OTA detected with original request fields on attempt $i."
              break
            fi
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "No OTA detected with original request fields in 5 attempts."
          fi
