name: Tecno Naman Telegram Test

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/telegram-test.yml"

permissions:
  contents: read

jobs:
  telegram-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OTA Tracker
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Probe TECNO POVA Slim 5G Global with multiple identities
        run: |
          set -o pipefail
          FOUND=""
          for i in $(seq 1 20); do
            IMEI=$(python -c 'from utils import functions; print(functions.generateImei())')
            echo "===== Identity attempt $i/20 | IMEI: $IMEI ====="
            OUTPUT=$(checkota -c configs/config-KM9.yml --region OP --imei "$IMEI" --dry-run --skip-telegram --timeout 60 2>&1 || true)
            echo "$OUTPUT"
            if echo "$OUTPUT" | grep -q "New OTA update found"; then
              FOUND="$IMEI"
              echo "FOUND_ELIGIBLE_IMEI=$IMEI"
              break
            fi
          done
          if [ -z "$FOUND" ]; then
            echo "No eligible identity found in 20 attempts."
          fi
