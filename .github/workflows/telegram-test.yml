name: Tecno Naman Telegram Test

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/telegram-test.yml"

permissions:
  contents: read

jobs:
  telegram-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OTA Tracker
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Send one known OTA to Telegram for testing
        env:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_id: ${{ secrets.CHAT_ID }}
          telegraph_token: ${{ secrets.TELEGRAPH_TOKEN }}
        run: |
          sed -i 's/timeout=15/timeout=45/' checkota/telegram.py
          checkota -c configs/config-LJ8k.yml --region IN --force-notify --timeout 600
