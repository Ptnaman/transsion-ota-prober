name: Tecno Naman Telegram Test

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/telegram-test.yml"

permissions:
  contents: read

jobs:
  telegram-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OTA Tracker
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Probe KM9 Global from 170SP05 source build
        run: |
          checkota -c configs/config-KM9.yml --region OP --incremental 170003 --dry-run --skip-telegram --timeout 120
