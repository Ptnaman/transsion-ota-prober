name: Tecno Naman Telegram Test

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/telegram-test.yml"

permissions:
  contents: read

jobs:
  telegram-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OTA Tracker
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Probe TECNO POVA Slim 5G Global with multiple identities
        env:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_id: ${{ secrets.CHAT_ID }}
          telegraph_token: ${{ secrets.TELEGRAPH_TOKEN }}
        run: |
          set -o pipefail
          sed -i 's/timeout=15/timeout=45/' checkota/telegram.py
          FOUND=0
          for i in $(seq 1 20); do
            echo "===== Identity attempt $i/20 ====="
            OUTPUT=$(checkota -c configs/config-KM9.yml --region OP --force-notify --timeout 60 2>&1 || true)
            echo "$OUTPUT"
            if echo "$OUTPUT" | grep -q "New OTA update found"; then
              FOUND=1
              echo "Eligible rollout identity found on attempt $i."
              break
            fi
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "No eligible identity found in 20 attempts."
          fi
